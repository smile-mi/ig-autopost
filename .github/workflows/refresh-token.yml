name: refresh-ig-token
on:
  schedule: [{ cron: "17 3 * * 1" }]   # 매주 월요일 12:17 KST
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 토큰 갱신 후 시크릿 교체
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW=$(python3 scripts/refresh_token.py)
          echo "::add-mask::$NEW"
          gh secret set IG_TOKEN --body "$NEW" --repo "${{ github.repository }}"
